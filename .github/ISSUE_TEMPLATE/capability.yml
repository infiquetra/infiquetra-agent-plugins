name: Capability
description: Propose a new user- or operator-visible capability.
title: "[Capability]: "
body:
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the outcome and who benefits.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Explain the current state, evidence, and relevant constraints.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: State what is included and what is explicitly excluded.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance evidence
      description: Describe what would prove the capability works.
    validations:
      required: true
