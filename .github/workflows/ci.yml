name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Repository validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # No dependency installation on purpose. This job is the repository's
      # hermetic baseline: it runs the standard library only, so a package
      # index outage can never break the repository's own validation. The
      # provenance, bundle-staleness, and skill frontmatter checks all run
      # inside check_repo.py and are pure local computation.
      - name: Validate repository and plugin manifests
        run: python3 scripts/check_repo.py

      - name: Run validation tests
        run: python3 -m unittest discover -s tests -v

      - name: Check whitespace errors
        run: git diff --check

  plugin-tests:
    name: Ported plugin tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Pinned to the declared floor rather than to the newest interpreter,
      # because the portable packages target Python 3.10 or newer and a floor
      # that is never exercised is not a floor.
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install plugin test dependencies
        run: python -m pip install --upgrade pip requests urllib3 pytest

      # Exit status 5 means pytest collected nothing, which is the correct
      # state until the first plugin package lands. Any other non-zero status
      # is a real failure and fails the job.
      - name: Run ported plugin tests
        run: |
          set +e
          python -m pytest tests -q
          status=$?
          set -e
          if [ "$status" -eq 5 ]; then
            echo "No ported plugin tests collected yet."
            exit 0
          fi
          exit "$status"
