name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Repository validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # No dependency installation on purpose. This job is the repository's
      # hermetic baseline: it runs the standard library only, so a package
      # index outage can never break the repository's own validation. The
      # provenance, bundle-staleness, and skill frontmatter checks all run
      # inside check_repo.py and are pure local computation.
      - name: Validate repository and plugin manifests
        run: python3 scripts/check_repo.py

      - name: Run validation tests
        run: python3 scripts/ci/run_root_tests.py --report "${{ runner.temp }}/ci-reports/root-timings.json"

      - name: Check whitespace errors
        run: git diff --check

      - name: Preserve root timing diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: root-test-timings
          path: ${{ runner.temp }}/ci-reports/root-timings.json
          if-no-files-found: warn
          retention-days: 14

  plugin-tests:
    name: Ported plugin tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Only pip downloads/wheels; no venv, installed tools, config or credentials.
      PIP_CACHE_DIR: ${{ runner.temp }}/plugin-pip-downloads
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Pinned to the declared floor rather than to the newest interpreter,
      # because the portable catalog's contract is `python>=3.12` and a floor
      # that is never exercised is not a floor. The pin is the floor, not a
      # ceiling: the contract admits every later interpreter, and this job
      # exists to prove that the lowest interpreter it admits still runs the
      # ported tests. The floor is a single value with a single owner,
      # `tests/test_python_floor.py`; changing this version on its own makes
      # that test fail rather than letting the catalog disagree with itself.
      - name: Set up Python 3.12
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Identify Python download cache platform
        id: pip-platform
        run: |
          python - <<'PY'
          import os, platform, sysconfig
          distro = platform.freedesktop_os_release()
          policy = '-'.join((sysconfig.get_platform(), distro['ID'], distro['VERSION_ID'], *platform.libc_ver()))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'policy={policy}\n')
          PY

      # Exact key only. Installs always run, including after a cache hit. PR
      # caches remain in GitHub's PR ref scope; no release consumes these files.
      - name: Cache Python package downloads
        if: runner.environment == 'github-hosted' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: plugin-pip-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.pip-platform.outputs.policy }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('requirements-plugin-tests.txt', 'constraints-plugin-tests.txt') }}

      # The dependency list lives in requirements-plugin-tests.txt rather than
      # in this line. Twelve package-import branches are landing, each of which
      # may need its own test-time package; every one of them editing this
      # workflow is twelve conflicts on one line. A requirements file is
      # appended to instead.
      - name: Install plugin test dependencies
        timeout-minutes: 5
        run: |
          timeout --signal=TERM --kill-after=5s 240s python -m pip install --timeout 20 --retries 2 -r requirements-plugin-tests.txt -c constraints-plugin-tests.txt

      # The sweep's real-ctags tests run the actual Universal Ctags binary, because the mocked
      # unit tests cannot see a flag the real tool rejects. With CI set those tests fail rather
      # than skip when ctags is missing, so this install is what keeps them honest.
      - name: Install Universal Ctags
        timeout-minutes: 5
        run: |
          timeout --signal=TERM --kill-after=5s 270s python3 scripts/ci/provision_ctags.py

      - name: Run ported plugin tests
        run: python -m pytest plugins/*/tests -q --import-mode=importlib --junitxml="${{ runner.temp }}/ci-reports/plugin-junit.xml" --durations=25 --durations-min=0.1

      - name: Preserve plugin test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-test-junit
          path: ${{ runner.temp }}/ci-reports/plugin-junit.xml
          if-no-files-found: warn
          retention-days: 14

  claude-mods:
    name: Claude Code mods (${{ matrix.claude-code }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Only _cacache below is shared. npm logs, global installs, native linked
      # binaries, home, credentials and configuration never enter the cache.
      npm_config_cache: ${{ runner.temp }}/claude-npm-downloads
    # A separate job because the Claude Code CLI is a dependency, and the
    # `validate` job above stays the hermetic, standard-library-only baseline.
    #
    # The matrix is the floor, the pin, and the newest build. 2.1.286 is the
    # minimum build that loads these plugins' mods, held by CLAUDE_CODE_FLOOR
    # in tests/test_claude_plugin_packaging.py and recorded in DECISIONS.md; a
    # floor that is never exercised is not a floor. 2.1.289 is the build the
    # mods were written against. 2.1.296 is the newest build, which rejects
    # object tool results, so it guards against result-check drift. No run
    # needs a login or a secret.
    strategy:
      fail-fast: false
      matrix:
        claude-code: ['2.1.286', '2.1.289', '2.1.296']
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Identify qualified npm download cache platform
        id: npm-platform
        run: |
          node - <<'JS'
          const { execFileSync } = require('node:child_process');
          const { appendFileSync } = require('node:fs');
          const npm = execFileSync('npm', ['--version'], { encoding: 'utf8', timeout: 10000 }).trim();
          const glibc = process.report.getReport().header.glibcVersionRuntime;
          const allowed = process.platform === 'linux' && process.arch === 'x64' &&
            /^v22\./.test(process.version) && /^\d+\.\d+\.\d+$/.test(npm) && /^\d+\.\d+$/.test(glibc || '');
          appendFileSync(process.env.GITHUB_OUTPUT, `allowed=${allowed}\n`);
          if (allowed) {
            const policy = `${process.platform}-${process.arch}-glibc${glibc}-${process.version}-npm${npm}`;
            appendFileSync(process.env.GITHUB_OUTPUT, `policy=${policy}\n`);
          }
          JS

      # The inspected 2.1.286/289/296 installers place the exact-version npm
      # optional dependency's native binary; they do not fetch another archive.
      # npm retains its normal SRI checks on downloaded/cached payloads. This is
      # a download cache, never executable attestation or a release input.
      - name: Cache versioned Claude npm downloads
        if: runner.environment == 'github-hosted' && steps.npm-platform.outputs.allowed == 'true' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.npm_config_cache }}/_cacache
          key: claude-npm-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.npm-platform.outputs.policy }}-${{ matrix.claude-code }}-${{ hashFiles('.github/workflows/ci.yml') }}

      # The package links its native binary in a postinstall script. Run that
      # script by hand when the npm in use skipped it, then prove the exact
      # build is the one on PATH.
      - name: Install Claude Code ${{ matrix.claude-code }}
        timeout-minutes: 5
        run: |
          timeout --signal=TERM --kill-after=5s 270s bash -euo pipefail -c '
            npm install --prefer-offline --fetch-retries=1 --fetch-timeout=20000 -g "@anthropic-ai/claude-code@${{ matrix.claude-code }}"
            claude --version || node "$(npm root -g)/@anthropic-ai/claude-code/install.cjs"
            claude --version | grep -Fx "${{ matrix.claude-code }} (Claude Code)"
          '

      # Every package whose Claude adapter names a hooks module is validated
      # and tested, derived from the tree rather than listed here. The guard
      # keeps the loop from passing by finding nothing.
      - name: Validate and test every plugin that ships a mod
        run: |
          set -euo pipefail
          visited=""
          for hooks in plugins/*/com.infiquetra.claude/hooks/hooks.json; do
            grep -q '"modules"' "$hooks" || continue
            plugin="${hooks%%/com.infiquetra.claude/*}"
            claude plugin validate --strict "$plugin"
            claude plugin test "$plugin"
            visited="$visited ${plugin#plugins/}"
          done
          echo "validated and tested:$visited"
          for required in saga orchestrate; do
            case " $visited " in
              *" $required "*) ;;
              *) echo "plugins/$required ships no mod that was validated and tested" >&2; exit 1 ;;
            esac
          done

      # Run with the CLI on PATH, so the validator test in this module runs
      # instead of skipping.
      - name: Run the packaging tests against this build
        run: python3 -m unittest tests.test_claude_plugin_packaging -v
