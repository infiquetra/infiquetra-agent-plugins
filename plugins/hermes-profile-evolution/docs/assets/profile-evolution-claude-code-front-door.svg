<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code profile evolution front door</title>
  <desc id="desc">Supported Claude file edits pass through a blocking Team Mimir classifier hook, and governed requests continue through an automatic Hermes health preflight into target-owned dialogue. Bash and external editors are outside the hook.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#374151"/></marker><style>.title{font:700 38px system-ui;fill:#111827}.sub{font:400 21px system-ui;fill:#4b5563}.head{font:700 24px system-ui;fill:#111827}.body{font:400 19px system-ui;fill:#374151}.warn{font:700 18px system-ui;fill:#7c2d12}.box{stroke:#374151;stroke-width:3;rx:22}.line{stroke:#374151;stroke-width:5;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="80" y="78" class="title">Claude Code profile evolution front door</text>
  <text x="80" y="116" class="sub">Supported file tools block governed edits; target authority stays behind Hermes.</text>
  <rect x="60" y="220" width="310" height="230" class="box" fill="#dbeafe"/><text x="90" y="270" class="head">Command or file tool</text><text x="90" y="312" class="body">Claimed Claude requester</text><text x="90" y="346" class="body">Safe intent + evidence</text><text x="90" y="380" class="body">Canonical continuation</text>
  <rect x="450" y="220" width="330" height="230" class="box" fill="#dcfce7"/><text x="480" y="270" class="head">Team Mimir classifier</text><text x="480" y="312" class="body">Ordinary → continue</text><text x="480" y="346" class="body">Governed → block edit</text><text x="480" y="380" class="body">Use command for dialogue</text>
  <rect x="860" y="220" width="330" height="230" class="box" fill="#ede9fe"/><text x="890" y="270" class="head">Hermes producer</text><text x="890" y="312" class="body">Automatic doctor first</text><text x="890" y="346" class="body">Then live dialogue</text><text x="890" y="380" class="body">Validates target response</text>
  <rect x="1270" y="220" width="270" height="230" class="box" fill="#fef3c7"/><text x="1300" y="270" class="head">Target profile</text><text x="1300" y="312" class="body">May accept, decline,</text><text x="1300" y="346" class="body">defer, ask questions,</text><text x="1300" y="380" class="body">or do nothing</text>
  <path d="M370 335 H440" class="line"/><path d="M780 335 H850" class="line"/><path d="M1190 335 H1260" class="line"/>
  <rect x="170" y="590" width="540" height="180" class="box" fill="#ffedd5"/><text x="205" y="640" class="head">Supported blocking hook</text><text x="205" y="680" class="body">Write · Edit · MultiEdit · NotebookEdit</text><text x="205" y="718" class="warn">Not Bash or external editors</text>
  <rect x="890" y="590" width="540" height="180" class="box" fill="#fee2e2"/><text x="925" y="640" class="head">Authority that never crosses</text><text x="925" y="680" class="body">No profile mutation · no commit · no credentials</text><text x="925" y="718" class="body">No provider choice · no offline queue</text>
</svg>
