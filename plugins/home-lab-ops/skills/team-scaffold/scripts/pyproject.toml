[project]
name = "team-scaffold"
version = "0.1.0"
description = "Scaffold a new infiquetra agent-team repo end-to-end (repo + identity + vault + deploy harness)."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
]

[project.scripts]
team-scaffold = "team_scaffold.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["team_scaffold"]

[tool.ruff]
line-length = 100
